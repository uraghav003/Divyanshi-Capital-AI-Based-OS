name: Deploy Apps Script & AI Studio Integration

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Clasp
        run: npm install -g @google/clasp

      - name: Configure Clasp Credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "Error: CLASPRC_JSON secret is missing. Please define it in your GitHub repository secrets."
            exit 1
          fi
          if [ -z "$SCRIPT_ID" ]; then
            echo "Error: SCRIPT_ID secret is missing. Please define it in your GitHub repository secrets."
            exit 1
          fi
          
          # Write the credentials to the home directory
          echo "$CLASPRC_JSON" > ~/.clasprc.json
          
          # Write the project configuration
          echo "{\"scriptId\":\"$SCRIPT_ID\",\"rootDir\":\"./\"}" > .clasp.json

      - name: Verify Clasp Authentication
        run: clasp login --status

      - name: Push to Google Apps Script
        run: clasp push -f

