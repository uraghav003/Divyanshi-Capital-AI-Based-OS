<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Divyanshi Capital | India's Premier Loan & Finance Facilitator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link rel="dns-prefetch" href="https://ui-avatars.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,600&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif; }
    h1, h2, h3, .display, .serif { font-family: 'Playfair Display', Georgia, serif; }

    /* ── DYNAMIC ROLE-BASED CSS THEME VARIABLES (Default: Midnight Executive Gold) ── */
    :root {
      --primary: #0B1F3A;
      --primary-dark: #071426;
      --primary-light: #142d54;
      --accent: #C9A84C;
      --accent-hover: #e8c56a;
      --accent-dim: #8a6f2e;
      --highlight: #F97316;
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --text: #0F172A;
      --text-muted: #64748B;
      --line: #E2E8F0;
      --green: #10B981;
      --red: #EF4444;
      --card-shadow: 0 12px 36px rgba(11, 31, 58, 0.08);
      --hero-grad: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 60%, #1e3a8a 100%);
      --badge-bg: rgba(201, 168, 76, 0.15);
      --badge-text: var(--accent-hover);
    }

    body { background: var(--bg); color: var(--text); overflow-x: hidden; -webkit-tap-highlight-color: transparent; min-height: 100vh; }
    a { text-decoration: none; color: inherit; }
    input, select, textarea, button { font-family: 'DM Sans', sans-serif; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    /* ── TOPBAR & TICKER ── */
    .topbar { background: var(--primary-dark); color: rgba(255, 255, 255, 0.85); padding: 8px 5%; display: flex; justify-content: space-between; align-items: center; font-size: 12px; gap: 8px; flex-wrap: wrap; }
    .ticker-wrap { flex: 1; overflow: hidden; white-space: nowrap; background: rgba(255, 255, 255, 0.06); border-radius: 6px; padding: 4px 12px; margin: 0 12px; }
    .ticker { display: inline-block; animation: ticker 32s linear infinite; font-size: 11px; font-weight: 700; color: var(--accent-hover); letter-spacing: 0.5px; text-transform: uppercase; }
    @keyframes ticker { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

    /* ── HEADER ── */
    .header { background: rgba(255, 255, 255, 0.98); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); padding: 12px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--line); box-shadow: 0 2px 15px rgba(0, 0, 0, 0.04); }
    .logo-wrap { display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .logo-img { height: 38px; width: auto; }
    .logo-text { display: flex; flex-direction: column; line-height: 1.1; }
    .logo-name { font-family: 'Playfair Display', serif; font-size: 19px; font-weight: 900; color: var(--primary); }
    .logo-tag { font-size: 8.5px; font-weight: 800; color: var(--highlight); letter-spacing: 1.2px; text-transform: uppercase; }
    
    .nav { display: flex; gap: 20px; align-items: center; }
    .nav a { font-size: 13px; font-weight: 700; color: var(--text); transition: color 0.2s; cursor: pointer; }
    .nav a:hover, .nav a.active { color: var(--accent-dim); }
    
    .btn { background: var(--accent); color: #000; border: 0; border-radius: 10px; padding: 11px 22px; font-weight: 800; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); letter-spacing: 0.2px; text-decoration: none; }
    .btn:hover { background: var(--accent-hover); transform: translateY(-1.5px); box-shadow: 0 8px 24px rgba(201, 168, 76, 0.35); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.5; pointer-events: none; }
    .btn-orange { background: var(--highlight); color: #fff; }
    .btn-orange:hover { background: #ea580c; box-shadow: 0 8px 24px rgba(249, 115, 22, 0.35); }
    .btn-outline { background: transparent; border: 1.5px solid rgba(255, 255, 255, 0.3); color: #fff; }
    .btn-outline:hover { background: rgba(255, 255, 255, 0.1); border-color: #fff; transform: translateY(-1.5px); }

    /* ── STAFF BANNER ── */
    .staff-bar { background: linear-gradient(90deg, var(--primary), var(--primary-light)); color: #fff; padding: 10px 5%; display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; font-weight: 600; border-bottom: 1px solid rgba(255,255,255,0.1); flex-wrap: wrap; gap: 8px; }
    .staff-bar-left { display: flex; align-items: center; gap: 10px; }
    .dot { width: 9px; height: 9px; background: var(--green); border-radius: 50%; box-shadow: 0 0 10px var(--green); animation: pulse 2s infinite; flex-shrink: 0; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.3); } }

    /* ── HERO SECTION ── */
    .hero { background: var(--hero-grad); color: #fff; padding: 60px 5% 50px; position: relative; overflow: hidden; }
    .hero-inner { position: relative; z-index: 1; display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 50px; align-items: center; max-width: 1280px; margin: 0 auto; }
    .hero-badge { display: inline-flex; align-items: center; gap: 8px; background: var(--badge-bg); border: 1px solid rgba(201, 168, 76, 0.35); border-radius: 100px; padding: 6px 16px; font-size: 12px; font-weight: 800; color: var(--badge-text); letter-spacing: 0.6px; text-transform: uppercase; margin-bottom: 20px; }
    .hero h1 { font-size: 44px; line-height: 1.15; margin-bottom: 16px; font-weight: 900; }
    .hero h1 span { color: var(--accent); }
    .hero p { font-size: 16px; line-height: 1.7; color: rgba(255, 255, 255, 0.82); margin-bottom: 28px; font-weight: 400; }
    .hero-btns { display: flex; gap: 14px; flex-wrap: wrap; }
    .hero-stats { display: flex; gap: 28px; margin-top: 36px; flex-wrap: wrap; }
    .stat-num { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 900; color: var(--accent); }
    .stat-lbl { font-size: 11px; color: rgba(255, 255, 255, 0.65); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }

    /* ── EMPLOYEE BANKER PROFILE CARD ── */
    .emp-card { background: rgba(255, 255, 255, 0.08); border: 1.5px solid rgba(201, 168, 76, 0.35); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border-radius: 24px; padding: 30px; box-shadow: 0 25px 60px rgba(0,0,0,0.3); text-align: center; }
    .emp-avatar-wrap { position: relative; width: 96px; height: 96px; margin: 0 auto 16px; }
    .emp-avatar { width: 96px; height: 96px; border-radius: 50%; border: 3.5px solid var(--accent); object-fit: cover; display: block; box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
    .emp-online { position: absolute; bottom: 4px; right: 4px; width: 18px; height: 18px; background: var(--green); border: 3px solid var(--primary-dark); border-radius: 50%; }
    .emp-name { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 800; color: #fff; margin-bottom: 4px; }
    .emp-role { font-size: 12.5px; color: var(--accent-hover); font-weight: 700; margin-bottom: 6px; letter-spacing: 0.5px; text-transform: uppercase; }
    .emp-dept { font-size: 11px; color: rgba(255,255,255,0.65); margin-bottom: 20px; }
    .emp-actions { display: flex; flex-direction: column; gap: 10px; }
    .eab { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px 18px; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.2s; border: 1px solid transparent; width: 100%; text-decoration: none; }
    .eab-wa { background: rgba(37, 211, 102, 0.15); color: #25d366; border-color: rgba(37, 211, 102, 0.3); }
    .eab-wa:hover { background: #25d366; color: #fff; }
    .eab-call { background: rgba(201, 168, 76, 0.15); color: var(--accent-hover); border-color: rgba(201, 168, 76, 0.3); }
    .eab-call:hover { background: var(--accent); color: #000; }
    .eab-apply { background: var(--accent); color: #000; font-weight: 800; }
    .eab-apply:hover { background: var(--accent-hover); }

    /* ── PARTNERS MARQUEE ── */
    .partners { background: var(--primary-dark); padding: 18px 5%; overflow: hidden; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .ptrack { display: flex; gap: 46px; align-items: center; animation: pscroll 30s linear infinite; white-space: nowrap; }
    .partner-tag { font-size: 13px; font-weight: 800; color: rgba(255,255,255,0.5); letter-spacing: 1px; text-transform: uppercase; transition: color 0.2s; }
    .partner-tag:hover { color: var(--accent); }
    @keyframes pscroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

    /* ── PRODUCTS GRID ── */
    .section { padding: 70px 5%; max-width: 1300px; margin: 0 auto; }
    .slabel { font-size: 11px; font-weight: 800; color: var(--accent-dim); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
    .stitle { font-size: 34px; font-weight: 900; color: var(--primary); margin-bottom: 8px; line-height: 1.2; }
    .ssub { font-size: 15px; color: var(--text-muted); margin-bottom: 36px; line-height: 1.6; max-width: 700px; }
    
    .loan-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
    .loan-card { background: var(--card-bg); border: 1.5px solid var(--line); border-radius: 18px; padding: 26px 20px; cursor: pointer; transition: all 0.3s; text-align: center; position: relative; overflow: hidden; }
    .loan-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--accent), var(--accent-hover)); transform: scaleX(0); transform-origin: left; transition: transform 0.3s; }
    .loan-card:hover { transform: translateY(-6px); box-shadow: 0 20px 40px rgba(11, 31, 58, 0.1); border-color: var(--accent); }
    .loan-card:hover::before { transform: scaleX(1); }
    .loan-icon { font-size: 40px; margin-bottom: 12px; display: inline-block; }
    .loan-card h3 { font-size: 16px; font-weight: 800; color: var(--primary); margin-bottom: 6px; }
    .loan-card p { font-size: 12px; color: var(--text-muted); font-weight: 500; }
    .loan-tag { display: inline-block; background: rgba(201, 168, 76, 0.12); color: var(--accent-dim); font-size: 11px; font-weight: 800; padding: 4px 12px; border-radius: 100px; margin-top: 12px; }

    /* ── EMI CALCULATOR SECTION ── */
    .calc-section { background: var(--hero-grad); padding: 70px 5%; color: #fff; }
    .calc-wrap { max-width: 1050px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; }
    .calc-box { background: #fff; border-radius: 24px; padding: 36px; box-shadow: var(--card-shadow); color: var(--text); }
    .flabel { font-size: 12px; font-weight: 800; color: var(--primary); margin: 14px 0 6px; letter-spacing: 0.4px; text-transform: uppercase; }
    .field { width: 100%; padding: 13px 16px; border: 1.5px solid var(--line); border-radius: 12px; font-size: 14px; font-weight: 600; color: var(--text); background: #fdfdfd; transition: all 0.2s; }
    .field:focus { border-color: var(--accent); box-shadow: 0 0 0 3.5px rgba(201, 168, 76, 0.15); outline: none; background: #fff; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .rbox { background: var(--primary); color: #fff; border-radius: 16px; padding: 22px; margin-top: 22px; display: none; animation: fadeUp 0.3s ease; }
    .remi { font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 800; color: var(--accent); }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* ── SMART FORM ── */
    .form-wrap { background: var(--bg); min-height: 100vh; padding: 48px 5%; }
    .form-box { max-width: 660px; margin: 0 auto; background: #fff; border-radius: 24px; padding: 40px; box-shadow: var(--card-shadow); border: 1.5px solid var(--line); }
    .staff-mini { display: flex; align-items: center; gap: 14px; background: linear-gradient(135deg, rgba(11,31,58,0.04), rgba(201,168,76,0.08)); border: 1px solid rgba(201,168,76,0.25); border-radius: 16px; padding: 14px 18px; margin-bottom: 24px; }
    .staff-mini img { width: 48px; height: 48px; border-radius: 50%; border: 2.5px solid var(--accent); object-fit: cover; }
    .bank-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-top: 8px; }
    .bchip { border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 12px; cursor: pointer; font-size: 11.5px; font-weight: 700; transition: all 0.2s; display: flex; align-items: center; gap: 8px; background: #fafafa; }
    .bchip.selected { border-color: var(--accent); background: rgba(201, 168, 76, 0.1); color: var(--primary); }
    .msg { text-align: center; margin-top: 14px; font-size: 13.5px; font-weight: 700; min-height: 20px; }
    .ok { color: var(--green); } .err { color: var(--red); }

    /* ── BULBHUL AI CHATBOT ── */
    .cfab { position: fixed; right: 24px; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); width: 62px; height: 62px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 26px; z-index: 200; cursor: pointer; box-shadow: 0 10px 30px rgba(201, 168, 76, 0.45); transition: all 0.3s; border: 0; }
    .cfab:hover { transform: scale(1.08); }
    .cbox { display: none; position: fixed; right: 24px; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); width: 390px; max-width: calc(100vw - 32px); height: 530px; background: #fff; border-radius: 24px; z-index: 199; overflow: hidden; box-shadow: 0 25px 70px rgba(0, 0, 0, 0.2); border: 1px solid var(--line); animation: slideUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); flex-direction: column; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .chead { background: var(--primary); color: #fff; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
    .chead-info { display: flex; align-items: center; gap: 10px; }
    .chead-av { width: 38px; height: 38px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .chead-title-row { display: flex; align-items: center; gap: 6px; }
    .chead-title { font-weight: 800; font-size: 14px; }
    .chead-rename-btn { background: rgba(255,255,255,0.2); border: 0; color: #fff; font-size: 11px; padding: 2px 6px; border-radius: 6px; cursor: pointer; transition: all 0.2s; line-height: 1; }
    .chead-rename-btn:hover { background: var(--accent); color: #000; }
    .chead-status { font-size: 11px; color: var(--green); font-weight: 700; margin-top: 2px; }
    .chead-close { cursor: pointer; opacity: 0.8; font-size: 18px; background: none; border: 0; color: #fff; padding: 4px; }
    .cbody { flex: 1; overflow-y: auto; padding: 16px; background: #f8fafc; display: flex; flex-direction: column; gap: 10px; }
    .bubble { padding: 12px 16px; border-radius: 16px; font-size: 13px; line-height: 1.55; max-width: 86%; word-break: break-word; font-weight: 500; }
    .bot-b { background: #fff; color: var(--text); border: 1px solid var(--line); border-bottom-left-radius: 4px; align-self: flex-start; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
    .user-b { background: var(--primary); color: #fff; border-bottom-right-radius: 4px; align-self: flex-end; }
    .quick-chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 14px; background: #fff; border-top: 1px solid var(--line); }
    .qchip { font-size: 11px; font-weight: 700; color: var(--primary); background: #f1f5f9; padding: 5px 10px; border-radius: 100px; cursor: pointer; transition: all 0.2s; border: 1px solid var(--line); }
    .qchip:hover { background: var(--accent); color: #000; border-color: var(--accent); }
    .cinp { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--line); background: #fff; align-items: center; }
    .cinp input { flex: 1; padding: 10px 16px; border: 1.5px solid var(--line); border-radius: 100px; font-size: 13px; background: #f8fafc; outline: none; transition: border-color 0.2s; }
    .cinp input:focus { border-color: var(--accent); }
    .csend, .cmic { width: 38px; height: 38px; border-radius: 50%; background: var(--accent); border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 900; transition: all 0.2s; flex-shrink: 0; }
    .csend:hover, .cmic:hover { background: var(--accent-hover); }
    .cmic { background: #f1f5f9; color: var(--text); border: 1px solid var(--line); }
    .cmic.listening { background: var(--red); color: #fff; animation: pulse 1s infinite; }

    /* ── MOBILE STICKY BOTTOM BAR ── */
    .mobile-bar { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.98); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-top: 1px solid var(--line); padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px)); z-index: 99; justify-content: space-around; box-shadow: 0 -4px 20px rgba(0,0,0,0.06); }
    .mob-item { display: flex; flex-direction: column; align-items: center; font-size: 10.5px; font-weight: 700; color: var(--text-muted); gap: 3px; padding: 4px 10px; border-radius: 8px; cursor: pointer; }
    .mob-item.active { color: var(--primary); }
    .mob-icon { font-size: 18px; }

    @media(max-width: 900px) {
      .hero-inner { grid-template-columns: 1fr; gap: 36px; }
      .hero h1 { font-size: 34px; }
      .calc-wrap { grid-template-columns: 1fr; }
      .nav { display: none; }
      .header .btn { display: none; }
      .mobile-bar { display: flex; }
      .cfab { bottom: calc(74px + env(safe-area-inset-bottom, 0px)); }
      .cbox { bottom: calc(140px + env(safe-area-inset-bottom, 0px)); }
      body { padding-bottom: 70px; }
    }
  </style>
</head>

    return '<label class="bchip">' +
      '<input type="checkbox" value="' + safe(b) + '" onchange="syncBanks()">' + safe(b) +
    '</label>';
  }).join('');
  document.getElementById('pb').value = '';
  loadVariants();

function toggleBank(chip, name) {
  var c = chip.querySelector('input');
  c.checked = !c.checked;
  chip.classList.toggle('selected', c.checked);
  syncBanks();
}

function syncBanks() {
  document.querySelectorAll('.bchip').forEach(function(chip) {
    var input = chip.querySelector('input');
    chip.classList.toggle('selected', Boolean(input && input.checked));
  });
  var checked = Array.from(document.querySelectorAll('.bchip input:checked')).map(function(c) { return c.value; });
  document.getElementById('pb').value = checked.join(', ');
}

// ⚡ EMI CALCULATOR ENGINE
// ══════════════════════════════════════════════════════════════
function calcEMI() {
  var code = document.getElementById('clt') ? document.getElementById('clt').value : '';
  var inc = Number(document.getElementById('cin') ? document.getElementById('cin').value : 0) || 0;
  var amt = Number(document.getElementById('cam') ? document.getElementById('cam').value : 0) || 0;
  var yrs = Number(document.getElementById('cten') ? document.getElementById('cten').value : 1) || 1;

  if (!inc || !amt || !yrs) { return; }
  var prod = PRODUCTS.find(function(p) { return p.code === code; }) || PRODUCTS[0];
  var r = (prod.roi || 10.5) / 12 / 100;
  var n = yrs * 12;
  var emi = Math.round(amt * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1));
  var isEligible = emi <= inc * 0.55;

  var rbox = document.getElementById('rbox');
  if (rbox) {
    rbox.style.display = 'block';
    document.getElementById('remi').textContent = '₹' + money(emi) + ' / month';
    var rmsg = document.getElementById('rmsg');
    if (isEligible) {
      rmsg.textContent = '✅ Pre-Approved Eligibility Profile! (' + (prod.roi || 10.5) + '% ROI)';
      rmsg.style.color = '#10b981';
    } else {
      rmsg.textContent = '⚠️ High FOIR Ratio. Consider extending tenure or adjusting amount.';
      rmsg.style.color = '#f59e0b';
    }
  }
}

function applyWithEMI() {
  var code = document.getElementById('clt') ? document.getElementById('clt').value : '';
  var amt = document.getElementById('cam') ? document.getElementById('cam').value : '';
  var inc = document.getElementById('cin') ? document.getElementById('cin').value : '';
  go('form', { product: code, amount: amt, income: inc });
}

function renderMarkdownText(text) {
  var t = safe(text);
  t = t.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/\*(.*?)\*/g, '<em>$1</em>');
  t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
  t = t.replace(/\n/g, '<br>');
  return t;
}

function sendChat() {
  if (chatInFlight) return;
  var inp = document.getElementById('ci');
  var txt = inp ? inp.value.trim() : '';
  if (!txt) return;

  chatInFlight = true;
  var body = document.getElementById('cbody');
  body.innerHTML += '<div class="bubble user-b">' + safe(txt) + '</div>';
  inp.value = ''; body.scrollTop = body.scrollHeight;

  var loadingDiv = document.createElement('div');
  loadingDiv.className = 'bubble bot-b';
  loadingDiv.textContent = 'Analyzing banking criteria...';
  body.appendChild(loadingDiv);
  body.scrollTop = body.scrollHeight;

  // Immediate offline instant fallback if backend delayed
  var responded = false;
  var timer = setTimeout(function() {
    if (!responded) {
      responded = true;
      var offlineReply = evaluateOfflineAi(txt);
      loadingDiv.innerHTML = renderMarkdownText(offlineReply);
      body.scrollTop = body.scrollHeight;
      chatInFlight = false;
    }
  }, 1200);

  callGAS('avatar_chat', { message: txt, empCode: EMP_CODE || EMP || 'DC002', avatarMode:true }).then(function(res) {
    if (!responded) {
      responded = true;
      clearTimeout(timer);
      var rawReply = typeof res === 'string' ? res : ((res && (res.reply || res.text)) || evaluateOfflineAi(txt));
      loadingDiv.innerHTML = renderMarkdownText(rawReply);
      body.scrollTop = body.scrollHeight;
    }
  }).catch(function(err) {
    if (!responded) {
      responded = true;
      clearTimeout(timer);
      var errMsg = (err && err.message) ? err.message : 'Sorry, response timeout.';
      var offlineReply = evaluateOfflineAi(txt) || errMsg;
      loadingDiv.innerHTML = renderMarkdownText(offlineReply);
      body.scrollTop = body.scrollHeight;
    }
  }).finally(function() {
    chatInFlight = false;
  });
}
var sendAvatarChat = sendChat;

function toggleSpeech() {
  var mic = document.getElementById('micBtn');
  var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) { alert('Speech recognition not supported in this browser.'); return; }

  if (isListening && speechRecognizer) {
    speechRecognizer.stop();
    return;
  }

  speechRecognizer = new SpeechRecognition();
  speechRecognizer.lang = 'hi-IN';
  speechRecognizer.interimResults = false;

  speechRecognizer.onstart = function() {
    isListening = true;
    if (mic) mic.classList.add('listening');
  };

  speechRecognizer.onresult = function(e) {
    var transcript = e.results[0][0].transcript;
    var ci = document.getElementById('ci');
    if (ci) { ci.value = transcript; sendChat(); }
  };

  speechRecognizer.onerror = function() {
    isListening = false;
    if (mic) mic.classList.remove('listening');
  };

  speechRecognizer.onend = function() {
    isListening = false;
    if (mic) mic.classList.remove('listening');
  };

  speechRecognizer.start();
}

// 🚀 BOOTSTRAP & DYNAMIC THEME MOUNT
// ══════════════════════════════════════════════════════════════
var __STAFF_CACHE__ = {};
function bootstrapApp() {
  if (BOOT.staff || STAFF) {
    STAFF = BOOT.staff || STAFF;
    applyRoleTheme(STAFF.role || STAFF.department, THEME_PARAM);
    renderPage();
  } else if (EMP && EMP !== 'EMP_CODE') {
    var cached = __STAFF_CACHE__[EMP];
    if (!cached) {
      try {
        var raw = sessionStorage.getItem('DC_STAFF_' + EMP);
        if (raw) cached = JSON.parse(raw);
      } catch (_) {}
    }
    if (cached && cached.staff) {
      STAFF = cached.staff;
      applyRoleTheme(STAFF.role || STAFF.department, THEME_PARAM);
      renderPage();
      return;
    }
    callGAS('P1_STAFF_PUBLIC_', EMP).then(function(res) {
      if (res && res.staff) {
        STAFF = res.staff;
        __STAFF_CACHE__[EMP] = res;
        try { sessionStorage.setItem('DC_STAFF_' + EMP, JSON.stringify(res)); } catch (_) {}
        applyRoleTheme(STAFF.role || STAFF.department, THEME_PARAM);
      } else {
        applyRoleTheme('EXECUTIVE', THEME_PARAM);
      }
      renderPage();
    }).catch(function() {
      applyRoleTheme('EXECUTIVE', THEME_PARAM);
      renderPage();
    });
  } else {
    applyRoleTheme('EXECUTIVE', THEME_PARAM);
    renderPage();
  }
}

function renderPage() {
  updateActiveNav(PAGE);
  updateAiHeaderDisplay();
  if (PAGE === 'form' || PAGE === 'apply' || PAGE === 'smart') renderForm();
  else if (PAGE === 'card' || PAGE === 'profile') renderCard();
  else if (PAGE === 'dashboard') renderDashboard();
  else if (PAGE === 'avatar') renderAvatar();
  else if (PAGE === 'calling') renderCalling();
  else if (PAGE === 'voice') renderVoice();
  else renderHome();
}

bootstrapApp();
</script>
